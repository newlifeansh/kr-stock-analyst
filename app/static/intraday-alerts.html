<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>장중 시그널 감시 · 비밀노트</title>
<style>
:root{--bg:#f6f6f7;--panel:#fff;--text:#191919;--muted:#595959;--line:#d9d9d9;--accent:#1677ff}
@media(prefers-color-scheme:dark){:root{--bg:#151517;--panel:#202023;--text:#f4f4f5;--muted:#b8b8be;--line:#44444a;--accent:#85b8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:24px 20px 64px}nav{display:flex;justify-content:space-between;gap:16px;align-items:center}
a,button{color:var(--text);min-height:44px;padding:10px 12px;border-radius:8px}a{display:inline-block}button{font:inherit;background:var(--panel);border:1px solid var(--line);cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.6;cursor:wait}
h1{font-size:26px;line-height:1.3;margin:24px 0 8px}h2{font-size:18px;margin:28px 0 8px}p{margin:8px 0;color:var(--muted)}
#state{font-size:22px;font-weight:700;color:var(--text)}section{padding:20px 0;border-bottom:1px solid var(--line)}
ol{list-style:none;padding:0;margin:0}li{padding:20px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
li strong{font-size:18px}li p{margin:4px 0}small{font-size:14px;color:var(--muted)}#notice{padding:16px;background:var(--panel);border-radius:10px}
:target{outline:2px solid var(--accent);outline-offset:4px}
</style>
</head>
<body><main>
<nav aria-label="페이지 이동"><a id="home" href="/dashboard">홈으로</a><button id="refresh" type="button">다시 확인</button></nav>
<h1 id="heading">장중 시그널 감시</h1>
<p>시총 상위 100종목 · 완료된 5분봉 매수 확인 · 장중 수익확정·손절</p>
<section aria-label="감시 상태"><p id="state" role="status" aria-live="polite">상태 확인 중…</p>
<p id="coverage"></p><p id="updated"></p><p id="push"></p></section>
<p id="notice">전략 신호 기록이며 실제 주문·체결 내역이 아닙니다. 매수 확정 기록은 지워지지 않지만 이후 손실이 발생할 수 있습니다.</p>
<h2>장중 확정 기록</h2><p id="empty">기록을 확인하고 있습니다.</p><ol id="events"></ol>
<small id="version"></small>
</main>
<script>
const us=location.pathname.startsWith('/us/');
const endpoint=us?'/us/market/intraday-signals':'/market/intraday-signals';
document.querySelector('#home').href=us?'/us':'/dashboard';
document.querySelector('#heading').textContent=(us?'미국':'국내')+' 장중 시그널 감시';
const labels={disabled:'감시 꺼짐',not_started:'감시 시작 전',closed:'정규장 대기',monitoring:'장중 감시 중',degraded:'일부 데이터 확인 필요',stale:'감시 갱신 지연',unavailable:'감시 연결 확인 필요'};
const sideLabels={buy:'매수 확정',partial_sell:'1차 수익확정',sell:'전량 매도'};
function text(id,value){document.getElementById(id).textContent=value}
function time(value){const d=new Date(value);return Number.isNaN(d.getTime())?'시각 확인 필요':d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false})+' (한국시간)'}
let running=false;
async function refresh(){
 if(running)return;running=true;document.querySelector('#refresh').disabled=true;
 try{
  const response=await fetch(endpoint,{cache:'no-store',signal:AbortSignal.timeout(12000)});
  if(!response.ok)throw new Error('status');
  const data=await response.json(),m=data.monitor||{};
  const age=m.observed_at?(Date.now()-new Date(m.observed_at).getTime())/1000:null;
  const state=['monitoring','degraded'].includes(m.state)&&age>180?'stale':m.state;
  text('state',(data.mode==='shadow'?'시험 모드 · ':'')+(labels[state]||'상태 확인 필요'));
  text('coverage',m.universe_count!==undefined?'감시 대상 '+m.universe_count+'/100 · 이번 회차 평가 '+(m.evaluated||0)+'종목':'정규장 중 대상과 평가 수를 확인할 수 있습니다.');
  text('updated',m.observed_at?'마지막 확인 '+time(m.observed_at):'아직 수집된 감시 상태가 없습니다.');
  text('push',data.mode!=='alerts'?'사용자 푸시 발송 안 함':m.push_ready?'서버 푸시 연결 준비 · 기기 알림 권한과 시장 시그널 구독이 필요합니다.':'서버 푸시 설정 확인 필요');
  const list=document.querySelector('#events');list.replaceChildren();
  for(const event of data.items||[]){
   const li=document.createElement('li');li.id='event-'+event.event_id;
   const title=document.createElement('strong');title.textContent=(sideLabels[event.side]||event.side)+' · '+event.name;li.append(title);
   for(const value of ['관측 기준가 '+Number(event.reference_price).toLocaleString('ko-KR')+' '+event.currency,time(event.occurred_at),'잔여 비중 '+Math.round(event.remaining*100)+'% · 실제 체결 아님']){
    const p=document.createElement('p');p.textContent=value;li.append(p);
   }list.append(li);
  }
  text('empty',(data.items||[]).length?'':'아직 장중 확정 기록이 없습니다. 시험 모드는 운영 알림을 보내지 않습니다.');
  text('version',data.strategy_version||'');
  const selected=new URLSearchParams(location.search).get('event');
  if(selected&&document.getElementById('event-'+selected)&&!location.hash)location.hash='event-'+selected;
 }catch(error){text('state','상태 조회 실패');text('push','현재 감시·알림 정상 여부를 확인하지 못했습니다. 다시 확인해 주세요.')}
 finally{running=false;document.querySelector('#refresh').disabled=false}
}
document.querySelector('#refresh').addEventListener('click',refresh);refresh();
setInterval(()=>{if(!document.hidden)refresh()},30000);
</script></body></html>
