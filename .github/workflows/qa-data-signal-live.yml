name: QA data-signal live
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intraday_evidence_readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DIAG_PROJECT: ${{ vars.US_PRODUCTION_RAILWAY_PROJECT_ID }}
      DIAG_SERVICE: ${{ vars.US_PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global @railway/cli@5.45.7
      - name: Capture read-only US collector progress
        run: |
          mkdir -p artifacts/intraday-evidence
          railway logs --latest --json --lines 500 --project "$DIAG_PROJECT" --environment production --service "$DIAG_SERVICE" > artifacts/intraday-evidence/us-collector-runtime.jsonl
      - name: Inspect stored evidence in a read-only database transaction
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d)"
          ssh-keygen -q -t ed25519 -N '' -C "intraday-readonly-${GITHUB_RUN_ID}" -f "$task_dir/key"
          fingerprint="$(ssh-keygen -lf "$task_dir/key.pub" -E sha256 | awk '{print $2}')"
          eval "$(ssh-agent -s)"
          ssh-add "$task_dir/key"
          mkdir -p "$HOME/.ssh"
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile %s\n' "$task_dir/known_hosts" > "$HOME/.ssh/config"
          cleanup() { railway ssh keys remove "$fingerprint"; ssh-agent -k; }
          trap cleanup EXIT
          railway ssh keys add --key "$fingerprint" --name "intraday-readonly-${GITHUB_RUN_ID}"
          code="$(cat scripts/probe_us_signal_recovery.py)"
          command="python -c $(printf '%q' "$code")"
          mkdir -p artifacts/intraday-evidence
          railway ssh -p "$DIAG_PROJECT" -s "$DIAG_SERVICE" -e production --identity-file "$task_dir/key" -- "$command" > artifacts/intraday-evidence/report.json
          python3 -c 'import json,pathlib; p=json.loads(pathlib.Path("artifacts/intraday-evidence/report.json").read_text()); print(json.dumps({k:v for k,v in p.items() if k!="items"}))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-evidence-${{ github.run_id }}
          path: artifacts/intraday-evidence
          retention-days: 30
