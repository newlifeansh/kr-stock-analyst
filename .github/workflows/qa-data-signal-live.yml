name: QA data-signal live
on:
  workflow_dispatch:
    inputs:
      recover_domestic:
        description: Restart the existing domestic staging image after starting its DB
        type: boolean
        default: false
      finish_domestic_shutdown:
        description: Stop only domestic staging application deployments already configured to zero replicas
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  finish_domestic_shutdown:
    if: inputs.finish_domestic_shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DIAG_PROJECT: ${{ vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
      DIAG_WEB: ${{ vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
      DIAG_COLLECTOR: ${{ vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
    steps:
      - run: npm install --global @railway/cli@5.45.7
      - name: Finish requested zero-replica shutdown without touching DB or volumes
        run: |
          set -euo pipefail
          for service in "$DIAG_WEB" "$DIAG_COLLECTOR"; do
            state="$(railway service list -p "$DIAG_PROJECT" --environment staging --json | python -c 'import json,sys; s=next(x for x in json.load(sys.stdin) if x["id"]==sys.argv[1]); r=s.get("replicas") or {}; print(json.dumps({"id":s["id"],"configured":r.get("configured"),"running":r.get("running"),"stopped":s.get("deploymentStopped")}))' "$service")"
            printf '%s\n' "$state"
            printf '%s' "$state" | python -c 'import json,sys; s=json.load(sys.stdin); sys.exit(0 if s["configured"]==0 else 1)'
            if printf '%s' "$state" | python -c 'import json,sys; s=json.load(sys.stdin); sys.exit(0 if s["running"] and not s["stopped"] else 1)'; then
              railway down -p "$DIAG_PROJECT" --environment staging --service "$service" --yes
            fi
          done
  recover_domestic:
    if: inputs.recover_domestic && !inputs.finish_domestic_shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: domestic-staging-runtime
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
      RAILWAY_WEB_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
      RAILWAY_COLLECTOR_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
      RAILWAY_DATABASE_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE }}
      RAILWAY_REGION: ${{ vars.DASHBOARD_STAGING_RAILWAY_REGION }}
      QA_BASE_URL: ${{ vars.DASHBOARD_STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3247e6016f984953c9a00b86237d2d25c5b41adb
      - run: npm install --global @railway/cli@5.45.7
      - name: Recover the same staging deployments without rebuilding
        run: |
          ./scripts/railway_staging_runtime.sh up
          railway restart -p "$RAILWAY_PROJECT_ID" -e staging -s "$RAILWAY_COLLECTOR_SERVICE" --yes --json
          railway restart -p "$RAILWAY_PROJECT_ID" -e staging -s "$RAILWAY_WEB_SERVICE" --yes --json
          for attempt in {1..36}; do
            if curl -fsS --max-time 10 "$QA_BASE_URL/readyz"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Read post-close source evidence
        run: |
          mkdir -p artifacts/domestic-recovery
          curl -fsS --max-time 120 "$QA_BASE_URL/meta/signal-data-quality?probe=true" -o artifacts/domestic-recovery/quality.json
          curl -fsS --max-time 30 "$QA_BASE_URL/health" -o artifacts/domestic-recovery/health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domestic-recovery-${{ github.run_id }}
          path: artifacts/domestic-recovery
  verify_us_candidate:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      QA_BASE_URL: ${{ vars.US_STAGING_BASE_URL }}
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3247e6016f984953c9a00b86237d2d25c5b41adb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing candidate test dependencies
        run: |
          pip install -e '.[qa,mcp]'
          playwright install chromium
      - name: Reverify existing US candidate UI without deployment
        run: |
          analyst qa data-signal --mode e2e --surface us --base-url "$QA_BASE_URL" --output artifacts/reverify-us/e2e.json --artifact-dir artifacts/reverify-us/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverify-us-3247e60-${{ github.run_id }}
          path: artifacts/reverify-us
  collector_diagnostics:
    if: '!inputs.recover_domestic && !inputs.finish_domestic_shutdown'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        surface: [dashboard, us]
        role: [web, collector]
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DIAG_PROJECT: ${{ matrix.surface == 'us' && vars.US_STAGING_RAILWAY_PROJECT_ID || vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
      DIAG_SERVICE: ${{ matrix.role == 'web' && (matrix.surface == 'us' && vars.US_STAGING_RAILWAY_WEB_SERVICE || vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE) || (matrix.surface == 'us' && vars.US_STAGING_RAILWAY_COLLECTOR_SERVICE || vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE) }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global @railway/cli@5.45.7
      - name: Read sanitized staging service state only
        shell: bash
        run: |
          set -euo pipefail
          railway service list --project "$DIAG_PROJECT" --environment staging --json | python -c 'import json,sys; rows=json.load(sys.stdin); print(json.dumps([{key: row.get(key) for key in ("id","name","status","deploymentStopped","replicas")} for row in rows]))'
      - name: Read collector status and error log only
        shell: bash
        run: |
          set -euo pipefail
          railway logs --project "$DIAG_PROJECT" --service "$DIAG_SERVICE" --environment staging --lines 100 --json --latest | python scripts/safe_collector_diagnostics.py
      - name: Compare dated KRX daily candle without exporting credentials
        if: matrix.surface == 'dashboard' && matrix.role == 'collector'
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d)"
          ssh-keygen -q -t ed25519 -N '' -C "staging-diagnostic-${GITHUB_RUN_ID}" -f "$task_dir/key"
          fingerprint="$(ssh-keygen -lf "$task_dir/key.pub" -E sha256 | awk '{print $2}')"
          eval "$(ssh-agent -s)"
          ssh-add "$task_dir/key"
          mkdir -p "$HOME/.ssh"
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile %s\n' "$task_dir/known_hosts" > "$HOME/.ssh/config"
          cleanup() { railway ssh keys remove "$fingerprint"; ssh-agent -k; }
          trap cleanup EXIT
          railway ssh keys add --key "$fingerprint" --name "staging-diagnostic-${GITHUB_RUN_ID}"
          code='from app.config import get_settings; from app.collectors.briefing import KisRestBriefingProvider; import json; p=KisRestBriefingProvider(get_settings()); r=p._get("/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice", "FHKST03010100", {"FID_COND_MRKT_DIV_CODE":"J", "FID_INPUT_ISCD":"005930", "FID_INPUT_DATE_1":"20261012", "FID_INPUT_DATE_2":"20261012", "FID_PERIOD_DIV_CODE":"D", "FID_ORG_ADJ_PRC":"1"}); print(json.dumps([{k:x.get(k) for k in ("stck_bsop_date","stck_oprc","stck_hgpr","stck_lwpr","stck_clpr","acml_vol")} for x in r.get("output2",[]) if x.get("stck_bsop_date")=="20261012"])); q=p._request_current_price("005930"); print(json.dumps({k:q.get(k) for k in ("stck_oprc","stck_hgpr","stck_lwpr","stck_prpr","acml_vol")}))'
          command="python -c $(printf '%q' "$code")"
          railway ssh -p "$DIAG_PROJECT" -s "$DIAG_SERVICE" -e staging --identity-file "$task_dir/key" -- "$command"
          code='from app.config import get_settings; from app.collectors.briefing import KisRestBriefingProvider; import json; p=KisRestBriefingProvider(get_settings()); params={"FID_COND_MRKT_DIV_CODE":"J","FID_INPUT_ISCD":"005930","FID_PW_DATA_INCU_YN":"Y","FID_ETC_CLS_CODE":""}; print(json.dumps({hour:[{k:x.get(k) for k in ("stck_bsop_date","stck_cntg_hour","stck_prpr","stck_lwpr","cntg_vol")} for x in (p._get("/uapi/domestic-stock/v1/quotations/inquire-time-itemchartprice","FHKST03010200",dict(params,FID_INPUT_HOUR_1=hour)).get("output2") or []) if int(x.get("cntg_vol") or 0)>0][:5] for hour in ("160000","180000","200000")}))'
          command="python -c $(printf '%q' "$code")"
          railway ssh -p "$DIAG_PROJECT" -s "$DIAG_SERVICE" -e staging --identity-file "$task_dir/key" -- "$command"
          code='from app.config import get_settings; from app.collectors.briefing import KisRestBriefingProvider; import json; p=KisRestBriefingProvider(get_settings()); params={"FID_INPUT_ISCD":"005930","FID_INPUT_DATE_1":"20261008","FID_INPUT_DATE_2":"20261012","FID_PERIOD_DIV_CODE":"D","FID_ORG_ADJ_PRC":"1"}; keys=("stck_bsop_date","stck_oprc","stck_hgpr","stck_lwpr","stck_clpr","acml_vol"); print(json.dumps({market:[{k:x.get(k) for k in keys} for x in (p._get("/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice","FHKST03010100",dict(params,FID_COND_MRKT_DIV_CODE=market)).get("output2") or [])[:3]] for market in ("J","NX","UN")})); r=p._get("/uapi/domestic-stock/v1/quotations/inquire-daily-price","FHKST01010400",{"FID_COND_MRKT_DIV_CODE":"J","FID_INPUT_ISCD":"005930","FID_PERIOD_DIV_CODE":"D","FID_ORG_ADJ_PRC":"1"}); print(json.dumps([{k:x.get(k) for k in keys} for x in (r.get("output") or [])[:2]]))'
          command="python -c $(printf '%q' "$code")"
          railway ssh -p "$DIAG_PROJECT" -s "$DIAG_SERVICE" -e staging --identity-file "$task_dir/key" -- "$command"
          code='from app.config import get_settings; from app.collectors.briefing import KisRestBriefingProvider; from datetime import date; import json; p=KisRestBriefingProvider(get_settings()); pairs=[("005930","20261008"),("000660","20261012"),("373220","20261012")]; data=[];
          for code,day in pairs:
           r=p._get("/uapi/domestic-stock/v1/quotations/inquire-daily-itemchartprice","FHKST03010100",{"FID_COND_MRKT_DIV_CODE":"J","FID_INPUT_ISCD":code,"FID_INPUT_DATE_1":day,"FID_INPUT_DATE_2":day,"FID_PERIOD_DIV_CODE":"D","FID_ORG_ADJ_PRC":"1"}); m=p.fetch_historical_intraday_chart(code,date.fromisoformat(day[:4]+"-"+day[4:6]+"-"+day[6:]),max_points=391); data.append({"code":code,"day":day,"daily":[{k:x.get(k) for k in ("stck_bsop_date","stck_clpr","stck_oprc","stck_hgpr","stck_lwpr")} for x in r.get("output2",[]) if x.get("stck_bsop_date")==day],"minutes_count":len(m),"minute_first":m[:1],"minute_last":m[-1:],"minute_low":min([float(x["low"]) for x in m] or [0])});
          print(json.dumps({"cross_sample":data}))'
          command="python -c $(printf '%q' "$code")"
          railway ssh -p "$DIAG_PROJECT" -s "$DIAG_SERVICE" -e staging --identity-file "$task_dir/key" -- "$command"
