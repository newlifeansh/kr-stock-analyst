name: QA data-signal live

on:
  workflow_dispatch:
  schedule:
    # KST weekdays 08:20, 10:00 and 16:20.
    - cron: "20 23 * * 0-4"
    - cron: "0 1 * * 1-5"
    - cron: "20 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: domestic-staging-runtime
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        surface: [dashboard, us]
    environment: staging
    env:
      QA_BASE_URL: ${{ matrix.surface == 'us' && vars.US_STAGING_BASE_URL || vars.DASHBOARD_STAGING_BASE_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ENV: ${{ vars.KIS_ENV || 'real' }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
      RAILWAY_WEB_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
      RAILWAY_COLLECTOR_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
      RAILWAY_DATABASE_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE }}
      RAILWAY_REGION: ${{ vars.DASHBOARD_STAGING_RAILWAY_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and QA dependencies
        run: pip install -e '.[qa,mcp]'
      - name: Install Railway CLI for domestic staging
        if: matrix.surface == 'dashboard'
        run: npm install --global @railway/cli@5.45.7
      - name: Start domestic staging for live QA
        if: matrix.surface == 'dashboard'
        run: |
          export RAILWAY_RESUME_IMAGE_REF="$(./scripts/railway_staging_runtime.sh pin)"
          test -n "$RAILWAY_RESUME_IMAGE_REF"
          ./scripts/railway_staging_runtime.sh up
      - name: Run read-only staging and source checks
        shell: bash
        run: |
          test -n "$QA_BASE_URL"
          kis_flag=""
          if [[ -n "$KIS_APP_KEY" && -n "$KIS_APP_SECRET" ]]; then
            kis_flag="--direct-kis"
          fi
          analyst qa data-signal \
            --mode live \
            --surface "${{ matrix.surface }}" \
            --base-url "$QA_BASE_URL" \
            --output artifacts/qa-data-signal/live.json \
            $kis_flag
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-data-signal-live-${{ matrix.surface }}-${{ github.run_id }}
          path: artifacts/qa-data-signal/live.json
          if-no-files-found: error
          retention-days: 30
      - name: Stop domestic staging after live QA
        if: ${{ always() && matrix.surface == 'dashboard' }}
        run: ./scripts/railway_staging_runtime.sh down

  production-regular-session-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
      PRODUCTION_RAILWAY_COLLECTOR_SERVICE: ${{ vars.PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install read-only diagnostic dependencies
        run: |
          pip install -e '.[qa,mcp]'
          npm install --global @railway/cli@5.45.7
      - name: Capture domestic collector runtime evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/qa-data-signal
          railway logs --latest --json --lines 1000 \
            --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
            --service "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE" \
            > artifacts/qa-data-signal/domestic-production-collector-runtime.jsonl
      - name: Reproduce one completed-session evidence check without persistence
        continue-on-error: true
        run: |
          set -o pipefail
          railway run \
            --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
            --service "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE" \
            analyst regular-session-prices \
              --codes 005930 \
              --from-date 2026-10-15 \
              --to-date 2026-10-15 \
              --max-pairs 1 \
            > artifacts/qa-data-signal/domestic-regular-session-sample.json 2>&1
      - name: Upload domestic regular-session diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domestic-regular-session-diagnostic-${{ github.sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30
