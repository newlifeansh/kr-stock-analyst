name: Send one domestic stock-news notification

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Domestic stock code"
        required: true
        default: "005930"
        type: string
      rank:
        description: "Current stock-news rank"
        required: true
        default: "1"
        type: string
      expected_news_id:
        description: "Exact preview news ID approved for this send"
        required: true
        type: string
      confirm:
        description: "Type SEND-STOCK-NEWS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: send-stock-news-${{ inputs.code }}-${{ inputs.expected_news_id }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
      PRODUCTION_RAILWAY_COLLECTOR_SERVICE: ${{ vars.PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate exact operator approval
        env:
          CONFIRM: ${{ inputs.confirm }}
          CODE: ${{ inputs.code }}
          RANK: ${{ inputs.rank }}
          EXPECTED_NEWS_ID: ${{ inputs.expected_news_id }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "SEND-STOCK-NEWS"
          [[ "$CODE" =~ ^[0-9A-Za-z.]{1,12}$ ]]
          [[ "$RANK" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_NEWS_ID" =~ ^[0-9a-f]{20}$ ]]
          test -n "$RAILWAY_API_TOKEN"
          test -n "$PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE"
      - name: Install operator runtime
        run: |
          pip install -e .
          npm install --global @railway/cli@5.45.7
      - name: Register an ephemeral Railway SSH key
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/railway-stock-news-${GITHUB_RUN_ID}"
          ssh-keygen -q -t ed25519 -N "" -C "stock-news-${GITHUB_RUN_ID}" -f "$key_path"
          fingerprint="$(ssh-keygen -lf "$key_path.pub" -E sha256 | awk '{print $2}')"
          eval "$(ssh-agent -s)"
          ssh-add "$key_path"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  UserKnownHostsFile %s\n' \
            "$RUNNER_TEMP/railway-stock-news-known-hosts-${GITHUB_RUN_ID}" \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          echo "RAILWAY_SSH_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "RAILWAY_SSH_KEY_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          railway ssh keys add --key "$fingerprint" --name "stock-news-${GITHUB_RUN_ID}"
      - name: Send once through the domestic production database
        env:
          CODE: ${{ inputs.code }}
          RANK: ${{ inputs.rank }}
          EXPECTED_NEWS_ID: ${{ inputs.expected_news_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/operator
          railway ssh \
            --project "$PRODUCTION_RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE" \
            --identity-file "$RAILWAY_SSH_KEY_PATH" \
            -- python -m app.cli send-stock-news \
              --code "$CODE" \
              --rank "$RANK" \
              --expected-news-id "$EXPECTED_NEWS_ID" \
              --send \
              --confirm SEND-STOCK-NEWS \
              > artifacts/operator/stock-news-receipt.json
      - name: Remove the ephemeral Railway SSH key
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          if test -n "${RAILWAY_SSH_KEY_FINGERPRINT:-}"; then
            railway ssh keys remove "$RAILWAY_SSH_KEY_FINGERPRINT" || cleanup_status=$?
          fi
          if test -n "${RAILWAY_SSH_KEY_PATH:-}"; then
            rm -f "$RAILWAY_SSH_KEY_PATH" "$RAILWAY_SSH_KEY_PATH.pub"
          fi
          rm -f "$HOME/.ssh/config" \
            "$RUNNER_TEMP/railway-stock-news-known-hosts-${GITHUB_RUN_ID}"
          if test -n "${SSH_AGENT_PID:-}"; then
            kill "$SSH_AGENT_PID" || true
          fi
          exit "$cleanup_status"
      - name: Upload redacted send receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-news-${{ inputs.code }}-${{ inputs.expected_news_id }}-${{ github.run_id }}
          path: artifacts/operator/stock-news-receipt.json
          if-no-files-found: error
          retention-days: 90
