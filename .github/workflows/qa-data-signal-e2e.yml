name: QA exact hybrid production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        surface: [dashboard, us]
    environment: production
    env:
      QA_BASE_URL: ${{ matrix.surface == 'us' && vars.US_PRODUCTION_BASE_URL || vars.PRODUCTION_BASE_URL }}
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DIAG_PROJECT: ${{ matrix.surface == 'us' && vars.US_PRODUCTION_RAILWAY_PROJECT_ID || vars.PRODUCTION_RAILWAY_PROJECT_ID }}
      DIAG_WEB: ${{ matrix.surface == 'us' && vars.US_PRODUCTION_RAILWAY_WEB_SERVICE || vars.PRODUCTION_RAILWAY_WEB_SERVICE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de6a6bdf4379b5e1b9235cc372caa1bcf318a6de
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and browser runtime
        run: |
          pip install -e '.[qa,mcp]'
          playwright install --with-deps chromium
      - name: Install Railway CLI for existing QA authentication only
        if: env.QA_DASHBOARD_INVITE_CODE == ''
        run: npm install --global @railway/cli@5.45.7
      - name: Read existing invite credential without changing authentication
        if: env.QA_DASHBOARD_INVITE_CODE == ''
        shell: bash
        run: |
          set -euo pipefail
          invite_code="$(railway variable list --json --project "$DIAG_PROJECT" --service "$DIAG_WEB" --environment production | jq -r '.DASHBOARD_INVITE_CODE // empty')"
          test -n "$invite_code"
          echo "::add-mask::$invite_code"
          echo "QA_DASHBOARD_INVITE_CODE=$invite_code" >> "$GITHUB_ENV"
      - name: Mask derived authentication cookie in runner output too
        run: |
          python - <<'PY'
          import hashlib, os
          code = os.environ['QA_DASHBOARD_INVITE_CODE'].strip().upper()
          print('::add-mask::' + hashlib.sha256(('secret-note-invite-v1:' + code).encode()).hexdigest())
          PY
      - name: Verify exact deployed source and assets
        run: >-
          analyst qa release-parity
          --surface "${{ matrix.surface }}"
          --staging-url "$QA_BASE_URL"
          --source-sha de6a6bdf4379b5e1b9235cc372caa1bcf318a6de
          --wait-seconds 60
          --output artifacts/qa-data-signal/parity.json
      - name: Run US E2E and retry failed KR cases with explicit scope
        env:
          QA_SURFACE: ${{ matrix.surface }}
        run: |
          python - <<'PY'
          import json, os
          from time import monotonic
          from app.qa import e2e
          from app.qa.runner import run_data_signal_qa, write_qa_report
          surface = os.environ['QA_SURFACE']
          selected = {'SIG-UI-003','SIG-UI-008','SIG-UI-009','SIG-PUSH-COMMUNITY-002','SIG-UI-015','SIG-UI-016','SIG-UI-025'}
          original = e2e._run_page_case
          def scoped(**kwargs):
              if kwargs['case_id'] not in selected:
                  return e2e._result(kwargs['catalog_by_id'], kwargs['case_id'], 'skip', 'Outside explicit failed-case retry scope; prior evidence retained.', monotonic())
              return original(**kwargs)
          if surface == 'dashboard':
              e2e._run_page_case = scoped
          report = run_data_signal_qa(mode='e2e', surface=surface, base_url=os.environ['QA_BASE_URL'], artifact_dir='artifacts/qa-data-signal/screenshots')
          report['explicit_retry_scope'] = sorted(selected) if surface == 'dashboard' else 'all US E2E cases'
          write_qa_report(report, 'artifacts/qa-data-signal/e2e.json')
          print(json.dumps({'summary':report['summary'], 'checks':[{k:item[k] for k in ('id','status')} for item in report['checks']]}))
          failures = [item["id"] for item in report["checks"] if item["status"] == "fail"]
          if failures:
              raise SystemExit("E2E failures: " + ", ".join(failures))
          PY
      - name: Upload E2E report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-production-e2e-${{ matrix.surface }}-${{ github.run_id }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 90
