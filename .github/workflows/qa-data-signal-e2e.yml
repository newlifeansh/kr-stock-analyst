name: QA domestic production E2E read only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      QA_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and Chromium
        run: |
          pip install -e '.[qa,mcp]'
          playwright install --with-deps chromium
      - id: e2e
        name: Check domestic production screen
        continue-on-error: true
        run: >-
          analyst qa data-signal
          --mode e2e
          --surface dashboard
          --base-url "$QA_BASE_URL"
          --timeout 45
          --output artifacts/qa-data-signal/domestic-production-e2e.json
          --artifact-dir artifacts/qa-data-signal/domestic-production-screenshots
      - name: Upload read-only E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domestic-production-e2e-${{ github.sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30
      - name: Enforce E2E result
        if: always()
        run: test '${{ steps.e2e.outcome }}' = success
