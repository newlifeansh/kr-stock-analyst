name: Deploy Railway staging to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_production_source:
        description: "스테이징이 프로덕션 공개 API를 읽는 경우 운영 원천을 먼저 같은 SHA로 배포"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: railway-staging-production
  cancel-in-progress: false

env:
  STAGING_RAILWAY_PROJECT_ID: ${{ vars.STAGING_RAILWAY_PROJECT_ID }}
  STAGING_RAILWAY_SERVICE: ${{ vars.STAGING_RAILWAY_SERVICE }}
  PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
  PRODUCTION_RAILWAY_SERVICE: ${{ vars.PRODUCTION_RAILWAY_SERVICE }}
  STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://dark-theme-preview-staging.up.railway.app' }}
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and QA dependencies
        run: pip install -e '.[dev,qa,mcp]'
      - name: Run deterministic fixtures and contracts
        run: pytest -q --junitxml=artifacts/qa-data-signal/pytest.xml
      - name: Build and enforce gate report
        run: >-
          analyst qa data-signal
          --mode gate
          --pytest-junit artifacts/qa-data-signal/pytest.xml
          --output artifacts/qa-data-signal/gate.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-gate-${{ github.sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30

  deploy_staging:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL || 'https://dark-theme-preview-staging.up.railway.app' }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate Railway staging configuration
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$STAGING_RAILWAY_PROJECT_ID"
          test -n "$STAGING_RAILWAY_SERVICE"
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Deploy the checked-out SHA to staging
        run: >-
          railway up --detach --json
          --message "github-sha=${{ github.sha }}"
          --project "$STAGING_RAILWAY_PROJECT_ID"
          --environment staging
          --service "$STAGING_RAILWAY_SERVICE"

  deploy_production_bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.bootstrap_production_source == true
    needs: [gate, deploy_staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate Railway production configuration
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$PRODUCTION_RAILWAY_SERVICE"
          test -n "$PRODUCTION_BASE_URL"
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Bootstrap the canonical production source with the checked-out SHA
        run: >-
          railway up --detach --json
          --message "github-sha=${{ github.sha }}"
          --project "$PRODUCTION_RAILWAY_PROJECT_ID"
          --environment production
          --service "$PRODUCTION_RAILWAY_SERVICE"
      - name: Wait for the canonical signal API to serve the checked-out strategy
        shell: bash
        run: |
          expected_strategy_version="$(sed -n 's/^STRATEGY_VERSION = "\([^"]*\)"/\1/p' app/services/quant_signals.py)"
          test -n "$expected_strategy_version"
          for attempt in $(seq 1 60); do
            market_version="$(curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/market/quant-signals?universe_limit=100&limit=5&recent_days=30" | jq -r '.strategy_version // empty' 2>/dev/null || true)"
            stock_version="$(curl -fsS --max-time 20 "$PRODUCTION_BASE_URL/stocks/005930/quant-signals" | jq -r '.strategy_version // empty' 2>/dev/null || true)"
            if [[ "$market_version" == "$expected_strategy_version" && "$stock_version" == "$expected_strategy_version" ]]; then
              echo "Canonical signal API is ready: $expected_strategy_version"
              exit 0
            fi
            echo "Waiting for canonical signal API ($attempt/60): market=$market_version stock=$stock_version expected=$expected_strategy_version"
            sleep 10
          done
          echo "Canonical signal API did not serve $expected_strategy_version within the readiness window."
          exit 1

  staging_qa:
    needs: [deploy_staging, deploy_production_bootstrap]
    if: >-
      always() &&
      needs.deploy_staging.result == 'success' &&
      (needs.deploy_production_bootstrap.result == 'success' ||
       needs.deploy_production_bootstrap.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL || 'https://dark-theme-preview-staging.up.railway.app' }}
    env:
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ENV: ${{ vars.KIS_ENV || 'real' }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and browser runtime
        run: |
          pip install -e '.[qa,mcp]'
          playwright install --with-deps chromium
      - name: Wait for the staging release and verify current assets
        run: >-
          analyst qa release-parity
          --staging-url "$STAGING_BASE_URL"
          --source-sha "${{ github.sha }}"
          --wait-seconds 600
          --output artifacts/qa-data-signal/staging-parity.json
      - name: Run read-only staging and source checks
        shell: bash
        run: |
          kis_flag=""
          if [[ -n "$KIS_APP_KEY" && -n "$KIS_APP_SECRET" ]]; then
            kis_flag="--direct-kis"
          fi
          analyst qa data-signal \
            --mode live \
            --base-url "$STAGING_BASE_URL" \
            --output artifacts/qa-data-signal/live.json \
            $kis_flag
      - name: Run mobile dark and light staging E2E
        run: >-
          analyst qa data-signal
          --mode e2e
          --base-url "$STAGING_BASE_URL"
          --output artifacts/qa-data-signal/e2e.json
          --artifact-dir artifacts/qa-data-signal/screenshots
      - name: Upload staging QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-${{ github.sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30

  deploy_production:
    if: >-
      !(github.event_name == 'workflow_dispatch' &&
        inputs.bootstrap_production_source == true)
    needs: staging_qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate Railway production configuration
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$PRODUCTION_RAILWAY_SERVICE"
          test -n "$PRODUCTION_BASE_URL"
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Promote the same checked-out SHA to production
        run: >-
          railway up --detach --json
          --message "github-sha=${{ github.sha }}"
          --project "$PRODUCTION_RAILWAY_PROJECT_ID"
          --environment production
          --service "$PRODUCTION_RAILWAY_SERVICE"

  verify_production:
    needs: [staging_qa, deploy_production, deploy_production_bootstrap]
    if: >-
      always() &&
      needs.staging_qa.result == 'success' &&
      (needs.deploy_production.result == 'success' ||
       needs.deploy_production_bootstrap.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and QA dependencies
        run: pip install -e '.[qa,mcp]'
      - name: Verify staging and production release parity
        run: >-
          analyst qa release-parity
          --staging-url "$STAGING_BASE_URL"
          --production-url "$PRODUCTION_BASE_URL"
          --source-sha "${{ github.sha }}"
          --wait-seconds 600
          --output artifacts/qa-data-signal/production-parity.json
      - name: Run production read-only smoke checks
        run: >-
          analyst qa data-signal
          --mode live
          --base-url "$PRODUCTION_BASE_URL"
          --output artifacts/qa-data-signal/production-live.json
      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30
