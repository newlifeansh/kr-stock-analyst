name: Build and promote immutable Railway release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "build, stage, 또는 검증된 이미지의 promote-production"
        required: true
        type: choice
        options:
          - build
          - stage
          - stage-intraday
          - promote-production
        default: build
      candidate_version:
        description: "예: 20260922us94-rc1"
        required: true
        type: string
      product_surface:
        description: "검증·승격할 제품 surface"
        required: true
        type: choice
        options:
          - dashboard
          - us
        default: dashboard
      image_ref:
        description: "운영 승격 시 필수: ghcr.io/...@sha256:..."
        required: false
        type: string
      source_sha:
        description: "운영 승격 시 필수: 스테이징에서 검증한 전체 Git SHA"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ (inputs.action == 'stage' || (inputs.action == 'promote-production' && inputs.product_surface == 'dashboard')) && 'domestic-staging-runtime' || format('railway-release-{0}-{1}', inputs.product_surface, inputs.action) }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  US_STAGING_RAILWAY_PROJECT_ID: ${{ vars.US_STAGING_RAILWAY_PROJECT_ID }}
  US_STAGING_RAILWAY_WEB_SERVICE: ${{ vars.US_STAGING_RAILWAY_WEB_SERVICE }}
  US_STAGING_RAILWAY_COLLECTOR_SERVICE: ${{ vars.US_STAGING_RAILWAY_COLLECTOR_SERVICE }}
  US_STAGING_BASE_URL: ${{ vars.US_STAGING_BASE_URL }}
  DASHBOARD_STAGING_RAILWAY_PROJECT_ID: ${{ vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
  DASHBOARD_STAGING_RAILWAY_WEB_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
  DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
  DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE }}
  DASHBOARD_STAGING_RAILWAY_REGION: ${{ vars.DASHBOARD_STAGING_RAILWAY_REGION }}
  DASHBOARD_STAGING_BASE_URL: ${{ vars.DASHBOARD_STAGING_BASE_URL }}
  PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
  PRODUCTION_RAILWAY_WEB_SERVICE: ${{ vars.PRODUCTION_RAILWAY_WEB_SERVICE }}
  PRODUCTION_RAILWAY_COLLECTOR_SERVICE: ${{ vars.PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
  US_PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.US_PRODUCTION_RAILWAY_PROJECT_ID }}
  US_PRODUCTION_RAILWAY_WEB_SERVICE: ${{ vars.US_PRODUCTION_RAILWAY_WEB_SERVICE }}
  US_PRODUCTION_RAILWAY_COLLECTOR_SERVICE: ${{ vars.US_PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
  US_PRODUCTION_BASE_URL: ${{ vars.US_PRODUCTION_BASE_URL }}
  PRODUCT_SURFACE: ${{ inputs.product_surface }}

jobs:
  # Market-specific production bases must not overwrite the other market's
  # staging with an older baseline. This path has no production operation.
  intraday_shadow_staging:
    if: inputs.action == 'stage-intraday'
    needs: [validate_request, gate, build_image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[qa,mcp]'
      - run: python -m playwright install --with-deps chromium
      - run: npm install --global @railway/cli@5.45.7
      - name: Validate isolated target and preserved production ancestor
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
          if [[ "$PRODUCT_SURFACE" == "us" ]]; then
            git merge-base --is-ancestor f794377 HEAD
            echo "TARGET_PROJECT=$US_STAGING_RAILWAY_PROJECT_ID" >> "$GITHUB_ENV"
            echo "TARGET_WEB=$US_STAGING_RAILWAY_WEB_SERVICE" >> "$GITHUB_ENV"
            echo "TARGET_COLLECTOR=$US_STAGING_RAILWAY_COLLECTOR_SERVICE" >> "$GITHUB_ENV"
            echo "TARGET_URL=$US_STAGING_BASE_URL" >> "$GITHUB_ENV"
            echo "TARGET_MARKET=us" >> "$GITHUB_ENV"
          else
            git merge-base --is-ancestor 2da0ebf HEAD
            echo "TARGET_PROJECT=$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" >> "$GITHUB_ENV"
            echo "TARGET_WEB=$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE" >> "$GITHUB_ENV"
            echo "TARGET_COLLECTOR=$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE" >> "$GITHUB_ENV"
            echo "TARGET_URL=$DASHBOARD_STAGING_BASE_URL" >> "$GITHUB_ENV"
            echo "TARGET_MARKET=kr" >> "$GITHUB_ENV"
          fi
          test "$US_STAGING_RAILWAY_WEB_SERVICE" != "$US_PRODUCTION_RAILWAY_WEB_SERVICE"
          test "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE" != "$PRODUCTION_RAILWAY_WEB_SERVICE"
          digest=$(python -c 'from app.services.intraday_signals import implementation_digest; print(implementation_digest())')
          echo "EXPECTED_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Verify identical intraday implementation in US preproduction first
        if: inputs.product_surface == 'dashboard'
        run: >-
          python scripts/qa_intraday_monitor.py --mode live --market us
          --base-url "$US_STAGING_BASE_URL" --expected-digest "$EXPECTED_DIGEST"
          --output artifacts/intraday/us-prerequisite.json
      - name: Start shadow collectors with the exact built image in staging only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_PROJECT"
          test -n "$TARGET_WEB"
          test -n "$TARGET_COLLECTOR"
          # CLI 5.45.7 scale still consults linked context even with --project.
          railway link --project "$TARGET_PROJECT" --environment staging --service "$TARGET_WEB" --json
          if [[ "$TARGET_MARKET" == "kr" ]]; then
            test -n "$DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE"
            db_state=$(railway service list --project "$TARGET_PROJECT" --environment staging --json |
              jq -er --arg id "$DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE" \
                '.[] | select(.id == $id) | if .deploymentStopped or .status == "REMOVED" or .status == null then "inactive" else .status end')
            if [[ "$db_state" == "inactive" || "$db_state" == "FAILED" || "$db_state" == "CRASHED" ]]; then
              railway redeploy --project "$TARGET_PROJECT" --environment staging \
                --service "$DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE" --from-source --yes --json
            fi
          fi
          for service in "$TARGET_WEB" "$TARGET_COLLECTOR"; do
            railway variable set "INTRADAY_SIGNAL_MODE=shadow" --skip-deploys --json \
              --project "$TARGET_PROJECT" --environment staging --service "$service"
            railway service source connect --image "$IMAGE_REF" --json \
              --project "$TARGET_PROJECT" --environment staging --service "$service"
            railway service scale us-west=1 --json \
              --project "$TARGET_PROJECT" --environment staging --service "$service"
          done
      - name: Wait for candidate and verify scoped live and browser contracts
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if python scripts/qa_intraday_monitor.py --mode live --market "$TARGET_MARKET" \
              --base-url "$TARGET_URL" --expected-digest "$EXPECTED_DIGEST" \
              --output artifacts/intraday/live.json; then
              break
            fi
            sleep 15
          done
          python scripts/qa_intraday_monitor.py --mode live --market "$TARGET_MARKET" \
            --base-url "$TARGET_URL" --expected-digest "$EXPECTED_DIGEST" \
            --output artifacts/intraday/live.json
          python scripts/qa_intraday_monitor.py --mode e2e --market "$TARGET_MARKET" \
            --base-url "$TARGET_URL" --expected-digest "$EXPECTED_DIGEST" \
            --output artifacts/intraday/e2e.json
          jq -n --arg source "${{ needs.validate_request.outputs.source_sha }}" \
            --arg image "$IMAGE_REF" --arg surface "$PRODUCT_SURFACE" \
            --arg implementation "$EXPECTED_DIGEST" \
            '{source_sha:$source,image_ref:$image,surface:$surface,implementation_digest:$implementation,mode:"shadow",production_approved:false}' \
            > artifacts/intraday/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-shadow-${{ inputs.product_surface }}-${{ github.sha }}
          path: artifacts/intraday
          retention-days: 90

  validate_request:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - id: request
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_IMAGE_REF: ${{ inputs.image_ref }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PRODUCT_SURFACE: ${{ inputs.product_surface }}
        run: |
          set -euo pipefail
          [[ "$PRODUCT_SURFACE" == "dashboard" || "$PRODUCT_SURFACE" == "us" ]]
          if [[ "$REQUESTED_ACTION" == "stage" || "$REQUESTED_ACTION" == "promote-production" ]]; then
            for value in "$US_STAGING_RAILWAY_PROJECT_ID" "$US_STAGING_RAILWAY_WEB_SERVICE" \
              "$US_STAGING_RAILWAY_COLLECTOR_SERVICE" "$US_STAGING_BASE_URL" \
              "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE" \
              "$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE" \
              "$DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE" \
              "$DASHBOARD_STAGING_RAILWAY_REGION" "$DASHBOARD_STAGING_BASE_URL" \
              "$PRODUCTION_RAILWAY_PROJECT_ID" "$PRODUCTION_RAILWAY_WEB_SERVICE" \
              "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE" "$PRODUCTION_BASE_URL" \
              "$US_PRODUCTION_RAILWAY_PROJECT_ID" "$US_PRODUCTION_RAILWAY_WEB_SERVICE" \
              "$US_PRODUCTION_RAILWAY_COLLECTOR_SERVICE" "$US_PRODUCTION_BASE_URL"; do
              test -n "$value"
            done
            test "$US_STAGING_RAILWAY_PROJECT_ID" != "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID"
            test "$US_STAGING_RAILWAY_PROJECT_ID" != "$PRODUCTION_RAILWAY_PROJECT_ID"
            test "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" != "$PRODUCTION_RAILWAY_PROJECT_ID"
            test "$US_PRODUCTION_RAILWAY_PROJECT_ID" != "$PRODUCTION_RAILWAY_PROJECT_ID"
            test "$US_PRODUCTION_RAILWAY_PROJECT_ID" != "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID"
            test "$US_STAGING_BASE_URL" != "$DASHBOARD_STAGING_BASE_URL"
            test "$US_PRODUCTION_BASE_URL" != "$PRODUCTION_BASE_URL"
            test "$US_PRODUCTION_BASE_URL" != "$US_STAGING_BASE_URL"
            test "$US_STAGING_RAILWAY_WEB_SERVICE" != "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE"
            test "$US_STAGING_RAILWAY_COLLECTOR_SERVICE" != "$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE"
            test "$US_PRODUCTION_RAILWAY_WEB_SERVICE" != "$US_STAGING_RAILWAY_WEB_SERVICE"
            test "$US_PRODUCTION_RAILWAY_COLLECTOR_SERVICE" != "$US_STAGING_RAILWAY_COLLECTOR_SERVICE"
          fi
          if [[ "$REQUESTED_ACTION" == "promote-production" ]]; then
            [[ "$REQUESTED_IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
            [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "source_sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            test -z "$REQUESTED_IMAGE_REF"
            test -z "$REQUESTED_SOURCE_SHA"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  gate:
    if: inputs.action != 'promote-production'
    needs: validate_request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and QA dependencies
        run: pip install -e '.[dev,qa,mcp]'
      - name: Run deterministic fixtures and contracts
        run: pytest -q --junitxml=artifacts/qa-data-signal/pytest.xml
      - name: Build and enforce gate report
        run: >-
          analyst qa data-signal
          --mode gate
          --pytest-junit artifacts/qa-data-signal/pytest.xml
          --output artifacts/qa-data-signal/gate.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-gate-${{ needs.validate_request.outputs.source_sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30

  build_image:
    if: inputs.action != 'promote-production'
    needs: [validate_request, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push one immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.candidate_version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.validate_request.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate_request.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.candidate_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: release
        name: Record immutable candidate identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.validate_request.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/qa-data-signal/release-candidate
          jq -n \
            --arg candidate "${{ inputs.candidate_version }}" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_ref "$image_ref" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg product_surface "$PRODUCT_SURFACE" \
            '{candidate_version:$candidate, product_surface:$product_surface, source_sha:$source_sha, image_ref:$image_ref, image_digest:$image_digest, staging_runtime:{dashboard:{US_MARKET_ENABLED:false},us:{US_MARKET_ENABLED:true}}, production_runtime:{dashboard:{US_MARKET_ENABLED:"preserve_existing_until_url_cutover"},us:{US_MARKET_ENABLED:true}}, promotion_state:"built"}' \
            > artifacts/qa-data-signal/release-candidate/candidate.json
      - name: Upload immutable candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.candidate_version }}
          path: artifacts/qa-data-signal/release-candidate/candidate.json
          if-no-files-found: error
          retention-days: 90

  deploy_staging:
    if: inputs.action == 'stage'
    needs: [validate_request, gate, build_image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.US_STAGING_BASE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - name: Validate both Railway staging targets
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$US_STAGING_RAILWAY_PROJECT_ID"
          test -n "$US_STAGING_RAILWAY_WEB_SERVICE"
          test -n "$US_STAGING_RAILWAY_COLLECTOR_SERVICE"
          test -n "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID"
          test -n "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE"
          test -n "$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE"
          test -n "$DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE"
          test -n "$DASHBOARD_STAGING_RAILWAY_REGION"
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Start domestic staging only for deployment and QA
        env:
          RAILWAY_PROJECT_ID: ${{ env.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
          RAILWAY_WEB_SERVICE: ${{ env.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
          RAILWAY_COLLECTOR_SERVICE: ${{ env.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
          RAILWAY_DATABASE_SERVICE: ${{ env.DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE }}
          RAILWAY_REGION: ${{ env.DASHBOARD_STAGING_RAILWAY_REGION }}
        run: ./scripts/railway_staging_runtime.sh up
      - name: Set isolated market runtimes
        run: |
          set -euo pipefail
          railway variable set "US_MARKET_ENABLED=true" --skip-deploys --json \
            --project="$US_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$US_STAGING_RAILWAY_WEB_SERVICE"
          railway variable set "US_MARKET_ENABLED=true" --skip-deploys --json \
            --project="$US_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$US_STAGING_RAILWAY_COLLECTOR_SERVICE"
          railway variable set "US_MARKET_ENABLED=false" --skip-deploys --json \
            --project="$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE"
          railway variable set "US_PUBLIC_BACKEND_URL=$US_STAGING_BASE_URL" --skip-deploys --json \
            --project="$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE"
          railway variable set "US_MARKET_ENABLED=false" --skip-deploys --json \
            --project="$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE"
      - name: Deploy the exact image to us-market staging
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$US_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$US_STAGING_RAILWAY_WEB_SERVICE"
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$US_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$US_STAGING_RAILWAY_COLLECTOR_SERVICE"
      - name: Deploy the exact image to domestic staging
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE"
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE"
      - name: Restart the exact domestic candidate after database network warmup
        run: |
          set -euo pipefail
          sleep 90
          railway redeploy --from-source --yes --json \
            --project "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE"
          railway redeploy --from-source --yes --json \
            --project "$DASHBOARD_STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$DASHBOARD_STAGING_RAILWAY_WEB_SERVICE"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 \
              "${DASHBOARD_STAGING_BASE_URL%/}/readyz" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Domestic staging candidate did not become ready after database warmup" >&2
          exit 1

  staging_qa:
    if: inputs.action == 'stage'
    needs: [validate_request, build_image, deploy_staging]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        surface: [dashboard, us]
    environment:
      name: staging
      url: ${{ matrix.surface == 'us' && vars.US_STAGING_BASE_URL || vars.DASHBOARD_STAGING_BASE_URL }}
    env:
      PRODUCT_SURFACE: ${{ matrix.surface }}
      QA_BASE_URL: ${{ matrix.surface == 'us' && vars.US_STAGING_BASE_URL || vars.DASHBOARD_STAGING_BASE_URL }}
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ENV: ${{ vars.KIS_ENV || 'real' }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and browser runtime
        run: |
          pip install -e '.[qa,mcp]'
          playwright install --with-deps chromium
      - name: Wait for the staged product surface
        run: >-
          analyst qa release-parity
          --surface "$PRODUCT_SURFACE"
          --staging-url "$QA_BASE_URL"
          --source-sha "${{ needs.validate_request.outputs.source_sha }}"
          --wait-seconds 600
          --output artifacts/qa-data-signal/staging-parity.json
      - name: Run read-only staging integrations
        id: live_qa
        continue-on-error: true
        shell: bash
        run: |
          kis_flag=""
          if [[ -n "$KIS_APP_KEY" && -n "$KIS_APP_SECRET" ]]; then
            kis_flag="--direct-kis"
          fi
          analyst qa data-signal \
            --mode live \
            --surface "$PRODUCT_SURFACE" \
            --base-url "$QA_BASE_URL" \
            --output artifacts/qa-data-signal/live.json \
            $kis_flag
      - name: Allow API rate-limit window to reset before browser E2E
        run: sleep 65
      - name: Run mobile dark and light staging E2E
        id: browser_qa
        continue-on-error: true
        run: >-
          analyst qa data-signal
          --mode e2e
          --surface "$PRODUCT_SURFACE"
          --base-url "$QA_BASE_URL"
          --output artifacts/qa-data-signal/e2e.json
          --artifact-dir artifacts/qa-data-signal/screenshots
      - name: Enforce both staging QA reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/qa-data-signal/staging-parity.json
          test -f artifacts/qa-data-signal/live.json
          test -f artifacts/qa-data-signal/e2e.json
          test "${{ steps.live_qa.outcome }}" = "success"
          test "${{ steps.browser_qa.outcome }}" = "success"
      - name: Upload staging QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-${{ inputs.candidate_version }}-${{ matrix.surface }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 90

  staging_us_gateway_qa:
    if: inputs.action == 'stage'
    needs: [validate_request, deploy_staging]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: ${{ vars.DASHBOARD_STAGING_BASE_URL }}/us
    env:
      QA_BASE_URL: ${{ vars.DASHBOARD_STAGING_BASE_URL }}
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install QA and Chromium
        run: |
          pip install -e '.[qa,mcp]'
          playwright install --with-deps chromium
      - name: Check the same-origin US service route
        id: live_gateway
        continue-on-error: true
        run: >-
          analyst qa data-signal
          --mode live
          --surface us-gateway
          --base-url "$QA_BASE_URL"
          --output artifacts/qa-data-signal/us-gateway-live.json
      - name: Check the public US shell on mobile dark and light
        id: e2e_gateway
        continue-on-error: true
        run: >-
          analyst qa data-signal
          --mode e2e
          --surface us-gateway
          --base-url "$QA_BASE_URL"
          --output artifacts/qa-data-signal/us-gateway-e2e.json
          --artifact-dir artifacts/qa-data-signal/us-gateway-screenshots
      - name: Enforce US gateway QA evidence
        if: always()
        run: |
          set -euo pipefail
          test -f artifacts/qa-data-signal/us-gateway-live.json
          test -f artifacts/qa-data-signal/us-gateway-e2e.json
          test "${{ steps.live_gateway.outcome }}" = "success"
          test "${{ steps.e2e_gateway.outcome }}" = "success"
      - name: Upload US gateway QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-${{ inputs.candidate_version }}-us-gateway
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 90

  shutdown_domestic_staging:
    if: ${{ always() && inputs.action == 'stage' }}
    needs: [deploy_staging, staging_qa, staging_us_gateway_qa]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
      RAILWAY_WEB_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
      RAILWAY_COLLECTOR_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
      RAILWAY_DATABASE_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE }}
      RAILWAY_REGION: ${{ vars.DASHBOARD_STAGING_RAILWAY_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Stop domestic staging after every QA outcome
        run: ./scripts/railway_staging_runtime.sh down

  deploy_production:
    if: inputs.action == 'promote-production'
    needs: validate_request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_BASE_URL || vars.PRODUCTION_BASE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      IMAGE_REF: ${{ inputs.image_ref }}
      TARGET_PRODUCTION_RAILWAY_PROJECT_ID: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_RAILWAY_PROJECT_ID || vars.PRODUCTION_RAILWAY_PROJECT_ID }}
      TARGET_PRODUCTION_RAILWAY_WEB_SERVICE: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_RAILWAY_WEB_SERVICE || vars.PRODUCTION_RAILWAY_WEB_SERVICE }}
      TARGET_PRODUCTION_RAILWAY_COLLECTOR_SERVICE: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_RAILWAY_COLLECTOR_SERVICE || vars.PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
      TARGET_PRODUCTION_BASE_URL: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_BASE_URL || vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Validate exact production artifact and Railway configuration
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$TARGET_PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$TARGET_PRODUCTION_RAILWAY_WEB_SERVICE"
          test -n "$TARGET_PRODUCTION_RAILWAY_COLLECTOR_SERVICE"
          test -n "$TARGET_PRODUCTION_BASE_URL"
          [[ "$IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Enable the US runtime only on the dedicated US production target
        run: |
          set -euo pipefail
          if [[ "$PRODUCT_SURFACE" == "us" ]]; then
            railway variable set "US_MARKET_ENABLED=true" --skip-deploys --json \
              --project "$TARGET_PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
              --service "$TARGET_PRODUCTION_RAILWAY_WEB_SERVICE"
            railway variable set "US_MARKET_ENABLED=true" --skip-deploys --json \
              --project "$TARGET_PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
              --service "$TARGET_PRODUCTION_RAILWAY_COLLECTOR_SERVICE"
          fi
      - name: Promote the exact staged image to the selected production surface
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$TARGET_PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
            --service "$TARGET_PRODUCTION_RAILWAY_WEB_SERVICE"
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$TARGET_PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
            --service "$TARGET_PRODUCTION_RAILWAY_COLLECTOR_SERVICE"

  verify_production:
    if: inputs.action == 'promote-production'
    needs: [validate_request, deploy_production]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_BASE_URL || vars.PRODUCTION_BASE_URL }}
    env:
      PRODUCT_SURFACE: ${{ inputs.product_surface }}
      QA_STAGING_BASE_URL: ${{ inputs.product_surface == 'us' && vars.US_STAGING_BASE_URL || vars.DASHBOARD_STAGING_BASE_URL }}
      TARGET_PRODUCTION_BASE_URL: ${{ inputs.product_surface == 'us' && vars.US_PRODUCTION_BASE_URL || vars.PRODUCTION_BASE_URL }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.DASHBOARD_STAGING_RAILWAY_PROJECT_ID }}
      RAILWAY_WEB_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_WEB_SERVICE }}
      RAILWAY_COLLECTOR_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_COLLECTOR_SERVICE }}
      RAILWAY_DATABASE_SERVICE: ${{ vars.DASHBOARD_STAGING_RAILWAY_DATABASE_SERVICE }}
      RAILWAY_REGION: ${{ vars.DASHBOARD_STAGING_RAILWAY_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Railway CLI for dashboard staging parity
        if: inputs.product_surface == 'dashboard'
        run: npm install --global @railway/cli@5.45.7
      - name: Start domestic staging for production parity
        if: inputs.product_surface == 'dashboard'
        run: ./scripts/railway_staging_runtime.sh up
      - name: Install project and QA dependencies
        run: pip install -e '.[qa,mcp]'
      - name: Verify staging and production release parity
        run: >-
          analyst qa release-parity
          --surface "$PRODUCT_SURFACE"
          --staging-url "$QA_STAGING_BASE_URL"
          --production-url "$TARGET_PRODUCTION_BASE_URL"
          --source-sha "${{ needs.validate_request.outputs.source_sha }}"
          --wait-seconds 600
          --output artifacts/qa-data-signal/production-parity.json
      - name: Run production read-only smoke checks
        run: >-
          analyst qa data-signal
          --mode live
          --surface "$PRODUCT_SURFACE"
          --base-url "$TARGET_PRODUCTION_BASE_URL"
          --output artifacts/qa-data-signal/production-live.json
      - name: Stop domestic staging after production parity
        if: ${{ always() && inputs.product_surface == 'dashboard' }}
        run: ./scripts/railway_staging_runtime.sh down
      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ inputs.candidate_version }}-${{ inputs.product_surface }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 90
