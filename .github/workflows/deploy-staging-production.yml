name: Build and promote immutable Railway release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "build, stage, 또는 검증된 이미지의 promote-production"
        required: true
        type: choice
        options:
          - build
          - stage
          - promote-production
        default: build
      candidate_version:
        description: "예: 20260922v552-rc1"
        required: true
        type: string
      image_ref:
        description: "운영 승격 시 필수: ghcr.io/...@sha256:..."
        required: false
        type: string
      source_sha:
        description: "운영 승격 시 필수: 스테이징에서 검증한 전체 Git SHA"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: railway-release-${{ inputs.action }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  STAGING_RAILWAY_PROJECT_ID: ${{ vars.STAGING_RAILWAY_PROJECT_ID }}
  PRODUCTION_RAILWAY_PROJECT_ID: ${{ vars.PRODUCTION_RAILWAY_PROJECT_ID }}
  STAGING_RAILWAY_WEB_SERVICE: ${{ vars.STAGING_RAILWAY_WEB_SERVICE }}
  STAGING_RAILWAY_COLLECTOR_SERVICE: ${{ vars.STAGING_RAILWAY_COLLECTOR_SERVICE }}
  PRODUCTION_RAILWAY_WEB_SERVICE: ${{ vars.PRODUCTION_RAILWAY_WEB_SERVICE }}
  PRODUCTION_RAILWAY_COLLECTOR_SERVICE: ${{ vars.PRODUCTION_RAILWAY_COLLECTOR_SERVICE }}
  STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

jobs:
  validate_request:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
    steps:
      - id: request
        shell: bash
        env:
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_IMAGE_REF: ${{ inputs.image_ref }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_ACTION" == "promote-production" ]]; then
            [[ "$REQUESTED_IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
            [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "source_sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            test -z "$REQUESTED_IMAGE_REF"
            test -z "$REQUESTED_SOURCE_SHA"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  gate:
    if: inputs.action != 'promote-production'
    needs: validate_request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and QA dependencies
        run: pip install -e '.[dev,qa,mcp]'
      - name: Run deterministic fixtures and contracts
        run: pytest -q --junitxml=artifacts/qa-data-signal/pytest.xml
      - name: Build and enforce gate report
        run: >-
          analyst qa data-signal
          --mode gate
          --pytest-junit artifacts/qa-data-signal/pytest.xml
          --output artifacts/qa-data-signal/gate.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-gate-${{ needs.validate_request.outputs.source_sha }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 30

  build_image:
    if: inputs.action != 'promote-production'
    needs: [validate_request, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_ref: ${{ steps.release.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push one immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.candidate_version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.validate_request.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate_request.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.candidate_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: release
        name: Record immutable candidate identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.validate_request.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/qa-data-signal/release-candidate
          jq -n \
            --arg candidate "${{ inputs.candidate_version }}" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_ref "$image_ref" \
            --arg image_digest "$IMAGE_DIGEST" \
            '{candidate_version:$candidate, source_sha:$source_sha, image_ref:$image_ref, image_digest:$image_digest, promotion_state:"built"}' \
            > artifacts/qa-data-signal/release-candidate/candidate.json
      - name: Upload immutable candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.candidate_version }}
          path: artifacts/qa-data-signal/release-candidate/candidate.json
          if-no-files-found: error
          retention-days: 90

  deploy_staging:
    if: inputs.action == 'stage'
    needs: [validate_request, gate, build_image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      IMAGE_REF: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - name: Validate Railway staging configuration
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$STAGING_RAILWAY_PROJECT_ID"
          test -n "$STAGING_RAILWAY_WEB_SERVICE"
          test -n "$STAGING_RAILWAY_COLLECTOR_SERVICE"
          test -n "$STAGING_BASE_URL"
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]]
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Deploy the exact image to us-market staging
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$STAGING_RAILWAY_WEB_SERVICE"
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$STAGING_RAILWAY_PROJECT_ID" --environment staging \
            --service "$STAGING_RAILWAY_COLLECTOR_SERVICE"

  staging_qa:
    if: inputs.action == 'stage'
    needs: [validate_request, build_image, deploy_staging]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      QA_DASHBOARD_INVITE_CODE: ${{ secrets.DASHBOARD_INVITE_CODE }}
      QA_DASHBOARD_SHARE_ID: qa-automation
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ENV: ${{ vars.KIS_ENV || 'real' }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and browser runtime
        run: |
          pip install -e '.[qa,mcp]'
          playwright install --with-deps chromium
      - name: Wait for the staged domestic-only release
        run: >-
          analyst qa release-parity
          --staging-url "$STAGING_BASE_URL"
          --source-sha "${{ needs.validate_request.outputs.source_sha }}"
          --wait-seconds 600
          --output artifacts/qa-data-signal/staging-parity.json
      - name: Run read-only staging integrations
        shell: bash
        run: |
          kis_flag=""
          if [[ -n "$KIS_APP_KEY" && -n "$KIS_APP_SECRET" ]]; then
            kis_flag="--direct-kis"
          fi
          analyst qa data-signal \
            --mode live \
            --base-url "$STAGING_BASE_URL" \
            --output artifacts/qa-data-signal/live.json \
            $kis_flag
      - name: Allow API rate-limit window to reset before browser E2E
        run: sleep 65
      - name: Run mobile dark and light staging E2E
        run: >-
          analyst qa data-signal
          --mode e2e
          --base-url "$STAGING_BASE_URL"
          --output artifacts/qa-data-signal/e2e.json
          --artifact-dir artifacts/qa-data-signal/screenshots
      - name: Upload staging QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-${{ inputs.candidate_version }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 90

  deploy_production:
    if: inputs.action == 'promote-production'
    needs: validate_request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      IMAGE_REF: ${{ inputs.image_ref }}
    steps:
      - name: Validate exact production artifact and Railway configuration
        run: |
          test -n "$RAILWAY_API_TOKEN"
          test -n "$PRODUCTION_RAILWAY_PROJECT_ID"
          test -n "$PRODUCTION_RAILWAY_WEB_SERVICE"
          test -n "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE"
          test -n "$PRODUCTION_BASE_URL"
          [[ "$IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]
      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.45.7
      - name: Promote the exact staged image to production
        run: |
          set -euo pipefail
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
            --service "$PRODUCTION_RAILWAY_WEB_SERVICE"
          railway service source connect --image "$IMAGE_REF" --json \
            --project "$PRODUCTION_RAILWAY_PROJECT_ID" --environment production \
            --service "$PRODUCTION_RAILWAY_COLLECTOR_SERVICE"

  verify_production:
    if: inputs.action == 'promote-production'
    needs: [validate_request, deploy_production]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate_request.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and QA dependencies
        run: pip install -e '.[qa,mcp]'
      - name: Verify staging and production release parity
        run: >-
          analyst qa release-parity
          --staging-url "$STAGING_BASE_URL"
          --production-url "$PRODUCTION_BASE_URL"
          --source-sha "${{ needs.validate_request.outputs.source_sha }}"
          --wait-seconds 600
          --output artifacts/qa-data-signal/production-parity.json
      - name: Run production read-only smoke checks
        run: >-
          analyst qa data-signal
          --mode live
          --base-url "$PRODUCTION_BASE_URL"
          --output artifacts/qa-data-signal/production-live.json
      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ inputs.candidate_version }}
          path: artifacts/qa-data-signal
          if-no-files-found: error
          retention-days: 90
